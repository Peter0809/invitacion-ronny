<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación de Ronny</title>
<!-- Vinculación del archivo CSS -->
    <link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style src="styles.css"></style>
</head>
<body>

<div class="card">
    <h1>🎉 Invitación de Ronny 🎉</h1>
    <p>Busca tu canción favorita para añadirla a la playlist de la fiesta:</p>

    <div class="search-container">
        <input 
            id="search" 
            type="text" 
            placeholder="Escribe el nombre de la canción o artista..." 
            oninput="buscarCanciones()"
            autocomplete="off">
        <div id="results" class="results-list"></div>
    </div>

    <p id="status"></p>
</div>

<script src="script.js"></script>
</body>
</html>
